# Duel Masters Phase 1.5 local stack: PostgreSQL + .NET API.
services:
  db:
    image: postgres:16
    container_name: duel-masters-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-duel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-duel}
      POSTGRES_DB: ${POSTGRES_DB:-duelmasters}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-duel} -d ${POSTGRES_DB:-duelmasters}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    image: duel-masters-dotnet
    build:
      context: ..
      dockerfile: backends/dotnet/Dockerfile
    container_name: duel-masters-server
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB:-duelmasters};Username=${POSTGRES_USER:-duel};Password=${POSTGRES_PASSWORD:-duel}"
      Jwt__Key: ${JWT_KEY:-dev-only-change-me-in-production-012345678901234567890123}
      Jwt__Issuer: "duel-masters"
      Jwt__Audience: "duel-masters-client"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
